# Copy to accounts.yaml and fill in. No tokens live in this file — each
# account names an environment variable, read at run time.
#
# Ad account IDs below were discovered from your Meta ads access. Comments
# on an ad land on the Page post behind it, so the token for an account
# must be a Page token for the Page those ads run under.

accounts:
  - name: Republic of Barbers
    slug: republic-of-barbers
    token_env: ROB_PAGE_TOKEN
    facebook_page_id: "106828815133188"
    # instagram_user_id: "<from me/accounts?fields=instagram_business_account>"

    # Every ad account seen running ads for this Page. Confirmed live:
    #   3178575389134669  Republic Of Barbers   (Fresha/website service ads)
    #   1192428111245965  Rob Barbers           (boosted FB + IG posts)
    # The rest are agency accounts under the same business — drop any that
    # do not advertise this Page.
    ad_account_ids:
      - "3178575389134669"
      - "1192428111245965"
      - "909159656936045"   # SC1 - Marketing Agency
      - "548901053966634"   # SC - Marketing
      - "724406129355682"   # SC2 - Marketing Agency
      - "721934336045857"   # SC3 - Marketing Agency
      - "886036749311933"   # ROB Marketing Agency

