# Copy to accounts.yaml and fill in the token_env names. No tokens live in
# this file — each account names an environment variable, read at run time.
#
# The IDs below were verified against your Meta ads access: each ad account
# was checked for which Page it actually promotes, rather than inferred from
# its name. Two names are misleading, so do not go by them:
#   "ROB Marketing Agency" advertises Fitfable, not Republic of Barbers.
#   "Rob Barbers" advertises both Republic of Barbers and Fitfable.
#
# Comments on an ad live on the Page post behind it, so an account's token
# must be a Page token for that Page. An ad account promoting two Pages is
# listed under both businesses: each run reads only the posts its own token
# can see, and skips the rest.

accounts:
  - name: Republic of Barbers
    slug: republic-of-barbers
    token_env: ROB_PAGE_TOKEN
    facebook_page_id: "106828815133188"
    # instagram_user_id: "<me/accounts?fields=instagram_business_account>"
    ad_account_ids:
      - "3178575389134669"   # Republic Of Barbers — live (Fresha service ads)
      - "1192428111245965"   # Rob Barbers — live (also runs Fitfable ads)

  - name: Raising Thinkers
    slug: raising-thinkers
    token_env: RAISING_THINKERS_PAGE_TOKEN
    facebook_page_id: "1059125853953466"
    # instagram_user_id: "<me/accounts?fields=instagram_business_account>"
    ad_account_ids:
      - "548901053966634"    # SC - Marketing — live (Vid/Image campaign)

  # Turned up during the ad-account sweep and running ads. Remove this block
  # if you do not want it monitored.
  - name: Fitfable
    slug: fitfable
    token_env: FITFABLE_PAGE_TOKEN
    facebook_page_id: "117731341219971"
    ad_account_ids:
      - "886036749311933"    # ROB Marketing Agency — live
      - "1192428111245965"   # Rob Barbers — shared with Republic of Barbers

